apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: helm-order-service-github-action
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Sanjaymavi/HCL-Github-Actions-Helm.git
    targetRevision: main
    path: helm/order-service

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true